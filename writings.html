---
base-backlink: \
base-title: Writings
base-description: Random thoughts...
styles: writing
---

{% assign writings = site.writings | sort:"time" | reverse %}

{% for writing in writings %}
<div class="writing-item">
    <div class="name">
        <a  href="{{ writing.url }}">{{ writing.base-title }}</a>
        <div class="time">{{ writing.time }}</div>
    </div>
</div>
{% endfor %}
