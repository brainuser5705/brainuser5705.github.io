{% assign writings = site.writings %}

{% for writing in writings %}
<div class="writing-item">
    <div class="name">
        <a  href="{{ writing.url }}">{{ writing.base-title }}</a>
        <span class="time">({{ writing.time }})</span>
    </div>
</div>
{% endfor %}
